name: "GenreManager"
guid: "014df46b-ffdc-414f-b841-e7fb5546b8e5"
version: "0.0.1.0"
targetAbi: "10.11.0.0"
framework: "net8.0"
overview: "Display movie genres on the home page as Netflix-style sections"
description: |
  A Jellyfin plugin that integrates with Home Screen Sections to display
  genre-based sections on the home page.

  Features:
  - Configurable genre selection (20 genres available)
  - Customizable items per section
  - Support for movies and TV series
  - Netflix-style horizontal scrolling sections

  Requires: Home Screen Sections plugin v2.3.7+
category: "General"
owner: "max-aumard"
artifacts:
  - "Jellyfin.Plugin.GenreManager.dll"
changelog: |
  Version 0.0.1 - Testing version
  - Updated for Jellyfin 10.11.x compatibility
  - .NET 8.0 target framework
  - Fixed manifest compatibility issues
  - Ready for testing and feature additions
